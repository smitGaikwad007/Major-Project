<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer wavy cancellation ring -->
  <circle cx="100" cy="100" r="92" stroke="#873B45" stroke-width="2.5" stroke-opacity="0.85" />
  <circle cx="100" cy="100" r="84" stroke="#873B45" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.6" />
  <!-- Inner Ring -->
  <circle cx="100" cy="100" r="54" stroke="#873B45" stroke-width="1.8" stroke-opacity="0.85" />
  
  <!-- Curved Header Text: DAK BHAVAN NEW DELHI -->
  <path id="curve-top" d="M 30,100 A 70,70 0 0,1 170,100" fill="none" />
  <text font-family="'Playfair Display', serif" font-size="11.5" font-weight="bold" fill="#873B45" letter-spacing="3.5" text-anchor="middle">
    <textPath href="#curve-top" startOffset="50%">DAK BHAVAN NEW DELHI</textPath>
  </text>
  
  <!-- Curved Bottom Text: PHILATELIC SOCIETY -->
  <path id="curve-bottom" d="M 170,100 A 70,70 0 0,1 30,100" fill="none" />
  <text font-family="'Playfair Display', serif" font-size="10" font-weight="bold" fill="#873B45" letter-spacing="3" text-anchor="middle">
    <textPath href="#curve-bottom" startOffset="50%">★ PHILATELIC GUILD ★</textPath>
  </text>
  
  <!-- Center Date and Star -->
  <line x1="56" y1="84" x2="144" y2="84" stroke="#873B45" stroke-width="1" stroke-opacity="0.5" />
  <text x="100" y="104" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#873B45" text-anchor="middle" letter-spacing="2">
    15-AUG-47
  </text>
  <line x1="56" y1="116" x2="144" y2="116" stroke="#873B45" stroke-width="1" stroke-opacity="0.5" />
  <text x="100" y="132" font-family="sans-serif" font-size="9" font-weight="bold" fill="#B69A65" text-anchor="middle" letter-spacing="2">
    FIRST DAY OF ISSUE
  </text>
</svg>
